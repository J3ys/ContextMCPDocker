vectordb:
  provider: pinecone
  indexName: contextmcp-docs
  pinecone:
    cloud: aws
    region: us-east-1

embeddings:
  provider: ollama
  model: nomic-embed-text
  dimensions: 768
  ollama:
    baseUrl: http://ollama:11434

sources:
  - name: docs
    type: github
    repository: owner/repo
    parser: mdx
